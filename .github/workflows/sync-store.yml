# 依 site/store.json 與 docs/data/myacg-products.json 重新產生網站資料。
#   - 買動漫擋海外機房 IP，GitHub 連不到，所以「爬買動漫」改在 Mac 上每天跑（tools/mac-sync/）
#   - 這個 Action 只負責：有人修改 site/store.json 或產生器時，自動重新產生並 commit
#   - 也可以在 Actions 分頁手動按 Run workflow
name: 同步商品

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build-site.mjs'

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-store
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 產生網站資料
        run: node tools/build-site.mjs

      - name: 測試
        run: npm test

      - name: 有變動就 commit
        id: commit
        run: |
          git add docs/data docs/assets/myacg
          if git diff --cached --quiet; then
            echo "沒有變動"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "同步買動漫商品 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Action 用 GITHUB_TOKEN 推送時不一定會觸發 Pages 重新部署，這裡主動請求一次
      - name: 重新部署 GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "請求 Pages 重新部署失敗（可忽略，下次推送時會更新）"
